name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment: github-pages

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular app
        env:
          API_UTILIDADES_JWT: ${{ secrets.API_UTILIDADES_JWT }}
        run: |
          node --input-type=module -e '
          import { spawnSync } from "node:child_process";
          const jwt = process.env.API_UTILIDADES_JWT;
          if (!jwt) {
            console.error("The API_UTILIDADES_JWT environment secret is required.");
            process.exit(1);
          }
          const define = `API_UTILIDADES_JWT=${JSON.stringify(jwt)}`;
          const result = spawnSync("npx", ["ng", "build", "--configuration", "github-pages", "--define", define], { stdio: "inherit" });
          process.exit(result.status ?? 1);
          '

      - name: Configure SPA fallback
        run: |
          APP_DIR="dist/${{ github.event.repository.name }}/browser"
          cp "$APP_DIR/index.html" "$APP_DIR/404.html"

      - name: Check dist
        run: ls -la dist/${{ github.event.repository.name }}/browser

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/${{ github.event.repository.name }}/browser

  deploy:
    needs: build

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
