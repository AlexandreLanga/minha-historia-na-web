<div class="blog-post-container">
  <div *ngIf="post; else notFound">
    <header class="post-header">
      <div class="header-content">
        <h1 class="post-title">{{ post.title }}</h1>
        <div class="post-meta">
          <time class="post-date" [attr.datetime]="post.date.toISOString()">
            {{ post.date | date:'longDate' }}
          </time>
          <div class="post-summary">
            {{ post.summary }}
          </div>
        </div>
      </div>
      <div class="header-decoration">
        <div class="decoration-line"></div>
        <div class="decoration-accent"></div>
      </div>
    </header>

    <div *ngIf="isLoading" class="loading">Carregando...</div>
    <div *ngIf="!isLoading" class="markdown-content" [innerHTML]="safeContent"></div>

    <section class="feedback-card">
      <div class="feedback-intro">
        <h2>Deixe seu feedback</h2>
        <p>Se quiser comentar ou sugerir melhorias, envie seu feedback por email. Escolha entre Gmail ou Outlook, e abrirá uma mensagem pronta para você preencher.</p>
      </div>
      <div class="feedback-actions">
        <button type="button" class="feedback-button" (click)="openFeedbackOptions()">
          Feedback por email
        </button>
        <div *ngIf="showEmailOptions" class="feedback-options">
          <button type="button" class="feedback-option" (click)="sendFeedback('gmail')">Enviar pelo Gmail</button>
          <button type="button" class="feedback-option" (click)="sendFeedback('outlook')">Enviar pelo Outlook</button>
        </div>
      </div>
    </section>
  </div>
  <ng-template #notFound>
    <p>Post não encontrado.</p>
  </ng-template>
</div>
